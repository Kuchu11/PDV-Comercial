<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gerenciamento de Clientes - Store POS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#009b50",
                        "primary": "#afc8f0",
                        "on-secondary-fixed": "#1a1c1c",
                        "secondary": "#c6c6c7",
                        "on-background": "#e3e2e5",
                        "on-secondary-container": "#b4b5b5",
                        "tertiary-fixed": "#6bfe9c",
                        "primary-container": "#001f3f",
                        "inverse-primary": "#476083",
                        "error-container": "#93000a",
                        "surface-container-high": "#292a2c",
                        "on-tertiary-fixed": "#00210c",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#afc8f0",
                        "primary-fixed": "#d4e3ff",
                        "on-surface-variant": "#c4c6cf",
                        "surface-bright": "#38393c",
                        "on-tertiary-fixed-variant": "#005228",
                        "tertiary-fixed-dim": "#4ae183",
                        "tertiary-container": "#00250e",
                        "on-surface": "#e3e2e5",
                        "inverse-surface": "#e3e2e5",
                        "surface-dim": "#121316",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-tint": "#afc8f0",
                        "on-primary": "#163152",
                        "surface-container": "#1f2022",
                        "secondary-fixed-dim": "#c6c6c7",
                        "inverse-on-surface": "#2f3033",
                        "surface-container-highest": "#343537",
                        "on-secondary": "#2f3131",
                        "tertiary": "#4ae183",
                        "surface-container-low": "#1a1c1e",
                        "surface": "#121316",
                        "on-tertiary": "#003919",
                        "outline": "#8e9198",
                        "on-primary-container": "#6f88ad",
                        "outline-variant": "#43474e",
                        "background": "#121316",
                        "on-primary-fixed-variant": "#2f486a",
                        "on-error": "#690005",
                        "secondary-fixed": "#e2e2e2",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0d0e11",
                        "on-primary-fixed": "#001c3a",
                        "secondary-container": "#454747",
                        "surface-variant": "#343537"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "touch-target-lg": "64px",
                        "margin-tablet": "32px",
                        "gutter": "16px",
                        "touch-target-min": "48px",
                        "stack-gap": "12px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-total-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-total": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "display-total-mobile": ["36px", {"lineHeight": "44px", "fontWeight": "700"}],
                        "body-lg": ["20px", {"lineHeight": "30px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-bold": ["16px", {"lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "display-total": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            }
        }
    </script>
    <style>
        body {
            background-color: #121316;
            color: #e3e2e5;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: 2px solid white !important;
            border-color: white !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex items-center justify-between px-margin-mobile h-touch-target-lg">
        <div class="flex items-center gap-4">
            <h1 class="font-headline-lg text-headline-lg text-on-surface uppercase tracking-tight">Clientes</h1>
        </div>
        <div class="hidden md:flex gap-6">
            <a class="text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-highest px-4 py-2 rounded transition-colors" href="index.html">Vendas</a>
            <a class="text-primary font-bold font-label-md text-label-md hover:bg-surface-container-highest px-4 py-2 rounded transition-colors" href="#">Clientes</a>
            <a class="text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-highest px-4 py-2 rounded transition-colors" href="gerenciamento.html">Gerenciamento</a>
        </div>
    </header>

    <main class="mt-20 px-margin-mobile flex-grow max-w-4xl mx-auto w-full">
        <section class="mb-10">
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-primary">person_add</span>
                <h2 class="font-headline-md text-headline-md text-on-surface">Novo Cliente</h2>
            </div>
            <form class="space-y-6 bg-surface-container-low p-6 rounded-xl border border-outline-variant">
                <div class="space-y-2">
                    <label class="font-label-bold text-label-bold text-on-surface-variant" for="name">Nome</label>
                    <input class="w-full h-14 px-4 bg-surface-container-highest border-2 border-outline-variant text-on-surface font-body-md text-body-md rounded-lg focus:ring-0 transition-all" id="name" placeholder="Digite o nome completo" type="text"/>
                </div>
                <div class="space-y-2">
                    <label class="font-label-bold text-label-bold text-on-surface-variant" for="phone">Telefone</label>
                    <input class="w-full h-14 px-4 bg-surface-container-highest border-2 border-outline-variant text-on-surface font-body-md text-body-md rounded-lg focus:ring-0 transition-all" id="phone" placeholder="(00) 00000-0000" type="tel"/>
                </div>
                <div class="space-y-2">
                    <label class="font-label-bold text-label-bold text-on-surface-variant" for="address">Endereço/Onde mora</label>
                    <input class="w-full h-14 px-4 bg-surface-container-highest border-2 border-outline-variant text-on-surface font-body-md text-body-md rounded-lg focus:ring-0 transition-all" id="address" placeholder="Rua, número, bairro..." type="text"/>
                </div>
                <button class="w-full h-16 bg-on-tertiary-container hover:brightness-110 active:scale-[0.98] transition-all text-white font-headline-md text-headline-md rounded-lg flex items-center justify-center gap-3 shadow-lg" type="submit">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
                    Salvar Cliente
                </button>
            </form>
        </section>

        <hr class="border-outline-variant mb-10"/>

        <section class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-primary">group</span>
                    <h2 class="font-headline-md text-headline-md text-on-surface">Clientes Cadastrados</h2>
                </div>
                <span class="bg-surface-container-high px-4 py-1 rounded-full font-label-bold text-label-bold text-primary">0 Clientes</span>
            </div>
            <div class="grid gap-4">
                <!-- Injetado via clientes.js -->
            </div>
        </section>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full z-50 h-touch-target-lg bg-surface-container-low border-t border-outline-variant flex justify-around items-center px-gutter">
        <a class="flex flex-col items-center justify-center text-on-surface-variant h-full hover:bg-surface-container-high w-1/4" href="index.html">
            <span class="material-symbols-outlined">point_of_sale</span>
            <span class="font-label-bold text-label-bold">Vendas</span>
        </a>
        <a class="flex flex-col items-center justify-center text-primary font-bold border-t-4 border-primary h-full hover:bg-surface-container-high w-1/4" href="#">
            <span class="material-symbols-outlined">group</span>
            <span class="font-label-bold text-label-bold">Clientes</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant h-full hover:bg-surface-container-high w-1/4" href="gerenciamento.html">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-bold text-label-bold">Gerenciamento</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant h-full w-1/4 hover:bg-surface-container-high" href="historico.html">
            <span class="material-symbols-outlined">history</span>
            <span class="font-label-bold text-label-bold">Histórico</span>
        </a>
    </nav>

    <script src="js/db.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
